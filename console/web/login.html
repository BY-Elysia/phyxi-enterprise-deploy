<body class="login-page"><aside class="login-intro"><div class="login-brand"><span class="mark">P</span><strong>PhyXi</strong><span class="edition">Console</span></div><div class="login-intro-copy"><span class="eyebrow">MODEL DEPLOYMENT</span><h2>模型部署，<br>清晰可控。</h2><p>从独立配置到模型服务，<br>在一个工作台管理部署与企业接入。</p><div class="login-flow" aria-hidden="true"><span>模型权重</span><span>推理引擎</span><span>推理参数</span><strong>模型服务</strong><strong>企业网关 · 客户端接入</strong></div></div><small>单服务器 · 单模型服务</small></aside><main class="login-card"><div class="login-brand"><span class="mark">P</span><strong>PhyXi</strong></div><span class="eyebrow">欢迎回来</span><h1>登录控制台</h1><p class="login-description">登录后管理模型部署、企业网关和客户端接入。</p><form id="login-form"><label id="account-field">管理员账户<input id="username" name="username" value="admin" autocomplete="username" required></label><label><span id="password-label">密码</span><input id="password" name="password" type="password" autocomplete="current-password" required></label><p id="login-error" role="alert" aria-live="polite"></p><button id="login-submit" class="primary" type="submit" disabled>正在检查登录状态…</button></form><p class="login-help">忘记密码？请联系服务器运维人员重置。</p><noscript>请启用 JavaScript 后登录。</noscript></main></body></html>
