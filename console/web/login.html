<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · PhyXi</title><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head>
<body class="login-page"><main class="login-card"><div class="login-brand"><span class="mark">P</span><strong>PhyXi</strong></div><h1>管理员登录</h1><p class="login-description">登录后管理模型部署、企业网关和客户端接入。</p><form id="login-form"><label id="account-field">管理员账户<input id="username" name="username" value="admin" autocomplete="username" required></label><label><span id="password-label">密码</span><input id="password" name="password" type="password" autocomplete="current-password" required></label><p id="login-error" role="alert" aria-live="polite"></p><button id="login-submit" class="primary" type="submit" disabled>正在检查登录状态…</button></form><p class="login-help">忘记密码？请联系服务器运维人员重置。</p><noscript>请启用 JavaScript 后登录。</noscript></main></body></html>
