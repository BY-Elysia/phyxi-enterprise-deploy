[package]
name = "phyxi-console"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
libc = "0.2"
sha2 = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
tar = "0.4"
zeroize = "1"

hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
