[package]
name = "phyxi-console"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
sha2 = "0.10"
argon2 = "0.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
