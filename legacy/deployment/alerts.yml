groups:
  - name: phyxi-model
    rules:
      - alert: ModelMetricsUnavailable
        expr: up{job="vllm"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "vLLM metrics endpoint unavailable"}
      - alert: ModelQueueBacklog
        expr: vllm:num_requests_waiting > 8
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "vLLM request queue persists above 8"}
