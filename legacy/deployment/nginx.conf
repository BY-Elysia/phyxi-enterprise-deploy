worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  map_hash_bucket_size 128;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_authorization $client_id {
    default "";
    include /etc/phyxi-secrets/client-keys.map;
  }
  limit_conn_zone $client_id zone=per_client:1m;
  limit_conn_zone $server_name zone=global:1m;
  log_format request '$time_iso8601 id=$request_id client=$client_id status=$status '
                     'seconds=$request_time upstream=$upstream_response_time';
  access_log /dev/stdout request;
  upstream model_backend {
    zone model_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server model:8000 resolve;
    keepalive 32;
  }
  server {
    listen 8443 ssl;
    server_name llm.corp.example;
    ssl_certificate /etc/phyxi-secrets/server-chain.pem;
    ssl_certificate_key /etc/phyxi-secrets/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 10.20.0.0/16;
    deny all;
    client_max_body_size 32m;
    location = /gateway-health {
      default_type application/json;
      return 200 '{"gateway":"ok"}\n';
    }
    location ~ ^/v1/(models|chat/completions)$ {
      if ($client_id = "") { return 401; }
      limit_conn per_client 4;
      limit_conn global 16;
      limit_conn_status 429;
      proxy_pass http://model_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Request-ID $request_id;
      include /etc/phyxi-secrets/upstream-auth.conf;
      proxy_buffering off;
      proxy_request_buffering on;
      proxy_cache off;
      proxy_next_upstream off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
      add_header X-Request-ID $request_id always;
      add_header X-Accel-Buffering no always;
    }
    location / { return 404; }
  }
}
