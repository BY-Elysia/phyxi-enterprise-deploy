name: phyxi-managed
services:
  console:
    image: ${PHYXI_CONTROL_IMAGE:-phyxi-console:local}
    build:
      context: ..
    restart: unless-stopped
    # Same network as the Docker daemon: model endpoints remain on loopback.
    network_mode: host
    environment:
      PHYXI_PORT: "8765"
      PHYXI_REQUIRE_ADMIN: "1"
      PHYXI_MANAGED_SERVICES: "1"
      PHYXI_CONTROL_IMAGE: ${PHYXI_CONTROL_IMAGE:-phyxi-console:local}
      PHYXI_GATEWAY_CONTAINER: phyxi-managed-gateway
      PHYXI_ACCESS_URL: http://127.0.0.1:8766
      PHYXI_ACCESS_ADMIN_FILE: ${PHYXI_DATA_DIR}/service-secrets/access.token
      # Local loopback HTTP only; enterprise Compose keeps HTTPS secure cookies.
      PHYXI_LOCAL_HTTP_LOGIN: "1"
      PHYXI_STATE_DIR: ${PHYXI_DATA_DIR:?Set PHYXI_DATA_DIR to an absolute host directory}
      PHYXI_DOCKER_HOST: unix:///var/run/docker.sock
      PHYXI_ENABLE_HOST_SETUP: "0"
    volumes:
      # Identical paths are required when the daemon mounts downloaded weights.
      - type: bind
        source: ${PHYXI_DATA_DIR}
        target: ${PHYXI_DATA_DIR}
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8765/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
