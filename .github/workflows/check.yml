name: Validate deployment bundle
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'nbformat>=5.10,<6'
      - run: python scripts/check-repository.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/test-cpu-runtime.py
      - name: Validate notebook schema
        run: python -c 'import nbformat; nbformat.validate(nbformat.read("notebooks/01-deploy-glm53-flash.ipynb", as_version=4))'
