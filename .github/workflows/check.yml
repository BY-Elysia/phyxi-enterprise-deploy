name: Check
on: [push, pull_request]
jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python3 scripts/smoke-console.py
      - run: python3 scripts/test-api-contract.py
      - run: python3 scripts/test-executor.py
      - name: Check development notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 scripts/check-dev-note.py --range "$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            python3 scripts/check-dev-note.py --range "$BEFORE..HEAD"
          else
            python3 scripts/check-dev-note.py --range "origin/main..HEAD"
          fi
